[tool.poetry]
name = "aqstat"
version = "1.0.2"
description = "Toolset for visualizing Air Quality Data from https://sensor.community"
authors = ["Gabor Vasarhelyi <vasarhelyi@hal.elte.hu>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/vasarhelyi/aqstat"
keywords = ["air quality", "air pollution", "sensor.community", "luftdaten.info"]

[tool.poetry.dependencies]
python = "^3.10"
click = "^8.4.1"
click-option-group = "^0.5.9"
requests = "^2.33.0"
pandas = "^2.3.3"
trio = "^0.18.0"
asks = "^2.4.12"
matplotlib = "^3.10.9"

[tool.poetry.scripts]
aqstat = "aqstat.cli.main:start"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
