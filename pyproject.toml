[project]
name = "aqstat"
version = "1.0.2"
description = "Toolset for visualizing Air Quality Data from https://sensor.community"
authors = [
      { name = "Gabor Vasarhelyi", email = "vasarhelyi@hal.elte.hu" },
]
license = "MIT"
readme = "README.md"
repository = "https://github.com/vasarhelyi/aqstat"
keywords = ["air quality", "air pollution", "sensor.community", "luftdaten.info"]

requires-python = ">=3.10"
dependencies = [
    "asks>=2.4.12",
    "click>=8.4.1",
    "click-option-group>=0.5.9",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "requests>=2.33.0",
    "trio>=0.18.0",
]

[project.scripts]
aqstat = "aqstat.cli.main:start"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
